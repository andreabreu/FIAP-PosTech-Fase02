[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fiap-postech-fase02"
version = "0.1.0"
description = "FIAP Tech Challenge Fase 02 — e-commerce recommender"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Andre Abreu", email = "andre.abreu@live.com" },
  { name = "Elizandra Monteiro", email = "monteiroelizandra2017@gmail.com" },
]
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "torch>=2.2",
  "scikit-learn>=1.4",
  "mlflow>=2.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "pre-commit>=3.0",
]
training = [
  "torch>=2.2",
  "scikit-learn>=1.4",
  "mlflow>=2.14",
  "tqdm>=4.66",
]
api = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "pre-commit>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
