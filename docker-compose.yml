services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: fase02-mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri /mlflow/mlruns
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  train:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: fase02-train
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: recommender-fase02
      PROJECT_NAME: fiap-postech-fase02
      RANDOM_SEED: "42"
      MODEL_NAME: mlp
      EMBEDDING_DIM: "32"
      MODELS_DIR: /app/models
      METRICS_DIR: /app/metrics
    volumes:
      - ./models:/app/models
      - ./metrics:/app/metrics
      - train_mlruns:/app/mlruns
    depends_on:
      mlflow:
        condition: service_healthy
    command: ["python", "-m", "src.training.entrypoint"]

volumes:
  mlflow_data:
  train_mlruns:
