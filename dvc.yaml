stages:
  preprocess:
    cmd: uv run python scripts/run_preprocess.py
      --input data/raw/interactions.csv
      --output data/processed/interactions_clean.csv
      --metrics metrics/preprocess.json
    deps:
      - data/raw/interactions.csv
      - scripts/run_preprocess.py
      - src/data/preprocess.py
      - src/schemas/interactions.py
    outs:
      - data/processed/interactions_clean.csv
    metrics:
      - metrics/preprocess.json:
          cache: false

  feature_eng:
    cmd: uv run python scripts/run_feature_eng.py
      --input data/processed/interactions_clean.csv
      --output-dir data/processed/features
      --params params.yaml
      --metrics metrics/feature_eng.json
    deps:
      - data/processed/interactions_clean.csv
      - scripts/run_feature_eng.py
      - src/features/engineering.py
      - params.yaml
    outs:
      - data/processed/features
    metrics:
      - metrics/feature_eng.json:
          cache: false

  train:
    cmd: uv run python scripts/run_train.py
      --train data/processed/features/train.csv
      --test data/processed/features/test.csv
      --params params.yaml
      --model-out models/recommender.pt
      --metrics metrics/train.json
      --no-mlflow
    deps:
      - data/processed/features/train.csv
      - data/processed/features/test.csv
      - scripts/run_train.py
      - src/models
      - src/training
      - src/evaluation
      - params.yaml
    outs:
      - models/recommender.pt:
          cache: false
    metrics:
      - metrics/train.json:
          cache: false

  evaluate:
    cmd: uv run python scripts/run_evaluate.py
      --train data/processed/features/train.csv
      --test data/processed/features/test.csv
      --model models/recommender.pt
      --metrics metrics/evaluate.json
      --k 10
    deps:
      - data/processed/features/train.csv
      - data/processed/features/test.csv
      - models/recommender.pt
      - scripts/run_evaluate.py
      - src/evaluation
    metrics:
      - metrics/evaluate.json:
          cache: false
